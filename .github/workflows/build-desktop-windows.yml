name: Build Windows CLI and Desktop

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Choose Build or full Release Acceptance"
        type: choice
        required: true
        default: build
        options:
          - build
          - release-acceptance

permissions:
  contents: read

concurrency:
  group: serial-tool-windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows ${{ inputs.build_mode }}
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install stable Rust (Windows x64 MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build or run release acceptance
        shell: pwsh
        run: |
          $mode = '${{ inputs.build_mode }}'
          $script = switch ($mode) {
            'build' { '.\scripts\build-all.ps1' }
            'release-acceptance' { '.\scripts\release-acceptance.ps1' }
            default { throw "Unsupported build mode: $mode" }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) { throw "$script failed (exit $LASTEXITCODE)" }

      - name: Verify ordinary Build EXEs and record short commit SHA
        id: artifact
        if: inputs.build_mode == 'build'
        shell: pwsh
        run: |
          foreach ($name in @("Serial Tool.exe", "serial-tool.exe")) {
            $exe = Join-Path "dist/windows-x64" $name
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Expected Windows EXE not found: $exe"
            }
            $file = Get-Item -LiteralPath $exe
            if ($file.Length -eq 0) { throw "Expected Windows EXE is empty: $exe" }
            $file | Select-Object FullName, Length
          }
          $shortSha = (git rev-parse --short=7 HEAD).Trim()
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Verify acceptance report and candidate artifacts
        id: acceptance
        if: inputs.build_mode == 'release-acceptance'
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path 'reports/release-acceptance' -Recurse -Filter 'report.json' -File)
          if ($reports.Count -ne 1) { throw "Expected exactly one acceptance report." }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -cne '${{ github.sha }}') { throw "Checkout HEAD mismatch." }
          $versionText = Get-Content -LiteralPath 'crates/serial-tool-core/Cargo.toml' -Raw
          $versionMatch = [regex]::Match($versionText, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success) { throw "Missing Core version." }
          if ($report.ok -ne $true -or $report.source_commit -cne $commit -or
              $report.project_version -cne $versionMatch.Groups[1].Value -or $report.hardware_touched -ne $false -or
              $report.failed_step -or $report.failure) { throw "Invalid acceptance report identity or status." }
          $requiredSteps = @('git-source','required-tools','versions','required-files','build-windows','artifacts','cli-smoke','stage-release','checksums','source-unchanged')
          $passed = @($report.steps | Where-Object { $_.result -ceq 'PASS' } | ForEach-Object { $_.name })
          if ($passed.Count -ne $requiredSteps.Count -or @($requiredSteps | Where-Object { $_ -cnotin $passed }).Count -ne 0) {
            throw "Incomplete acceptance steps."
          }
          $releaseRoot = [IO.Path]::GetFullPath((Join-Path $PWD.Path 'release'))
          $candidate = [IO.Path]::GetFullPath([string]$report.release_dir)
          if (-not $candidate.StartsWith($releaseRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Accepted candidate is outside release/."
          }
          $names = @('serial-tool.exe','Serial Tool.exe','LICENSE','THIRD_PARTY_NOTICES.txt','licenses/MPL-2.0.txt')
          $checksumFile = Join-Path $candidate 'checksums.txt'
          if (-not (Test-Path -LiteralPath $checksumFile -PathType Leaf)) { throw "Missing checksums.txt." }
          $entries = @(Get-Content -LiteralPath $checksumFile)
          if ($entries.Count -ne $names.Count) { throw "Incomplete checksum file." }
          foreach ($name in $names) {
            $path = Join-Path $candidate $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Missing or empty release file: $name"
            }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($entries -cnotcontains "$hash  $name") { throw "Checksum mismatch: $name" }
          }
          "candidate_dir=$candidate" >> $env:GITHUB_OUTPUT

      - name: Upload ordinary Windows EXEs
        if: inputs.build_mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: serial-tool-windows-x64-${{ steps.artifact.outputs.short_sha }}
          path: dist/windows-x64/*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload accepted release candidate
        if: inputs.build_mode == 'release-acceptance'
        uses: actions/upload-artifact@v4
        with:
          name: serial-tool-release-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.acceptance.outputs.candidate_dir }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload release acceptance evidence
        if: ${{ always() && inputs.build_mode == 'release-acceptance' }}
        uses: actions/upload-artifact@v4
        with:
          name: serial-tool-acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/release-acceptance/*/report.json
            reports/release-acceptance/*/summary.md
          if-no-files-found: warn
          retention-days: 30
