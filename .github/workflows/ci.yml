name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
          - platform: Windows
            os: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux serial dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked

  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
          - platform: Windows
            os: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Frontend tests
        run: npm test
        working-directory: apps/desktop
      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/desktop
      - name: Frontend build
        run: npm run build
        working-directory: apps/desktop
      - name: Format Tauri
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Clippy Tauri
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test Tauri
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build Tauri
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
