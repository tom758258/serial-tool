[package]
name = "serial-tool-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "serial-tool"
path = "src/main.rs"

[dependencies]
serial-tool-core = { path = "../serial-tool-core" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.24", features = ["v4"] }
